[project]
name = "lagga"
version = "0.0.0"
license = { text = "MIT" }
description = "Local ancestry GWAS with GPU Acceleration"
readme = "README.md"
authors = [{ name = "Franklin Ockerman", email = "frank.ockerman@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "jaxtyping>=0.3.3",
  "lanctools==0.1.3",
  "numba>=0.63.1",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "pgenlib>=0.93.0",
  "pyarrow>=21.0.0",
  "tqdm>=4.67.1",
  "typer>=0.20.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ipython>=8.37.0",
  "mkdocstrings-python>=2.0.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "zensical>=0.0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]

[project.scripts]
lagga = "lagga.cli:main_entry"

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.6.2"]
tpu = ["jax[tpu]>=0.6.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
]
