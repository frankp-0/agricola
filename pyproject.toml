[project]
name = "agricola"
version = "0.22.1"
license = "MIT"
description = "Admixed GWAS for Related Individuals Conditioning On Local Ancestry"
readme = "README.md"
authors = [{ name = "Franklin Ockerman", email = "frank.ockerman@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "jax>=0.11.1",
  "jaxlib>=0.11.1",
  "jaxtyping>=0.3.11",
  "lanctools>=1.0.1",
  "numba>=0.67.0",
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "pgenlib>=0.94.1",
  "pyarrow>=25.0.1",
  "rich>=15.0.0",
  "tqdm>=4.70.0",
  "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/frankp-0/agricola"
Documentation = "https://frankp-0.github.io/agricola/"
Repository = "https://github.com/frankp-0/agricola"
Issues = "https://github.com/frankp-0/agricola/issues"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ipython>=9.16.1",
  "mkdocstrings-python>=2.0.7",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "zensical>=0.0.57",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports/variables, etc.)
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear (common design bugs)
  "UP",  # pyupgrade (upgrades syntax to modern Python)
  "RUF", # Ruff-specific rules
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"src/agricola/cli/commands.py" = ["B008"]
"src/agricola/cli/runtime.py" = ["W291", "W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
agricola = "agricola.cli:main_entry"

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.11.1"]
tpu = ["jax[tpu]>=0.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
]
