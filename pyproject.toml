[project]
name = "lagga"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Frank Ockerman", email = "frank.ockerman@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "jax[cuda]>=0.8.0",
  "jaxlib>=0.8.0",
  "jaxtyping>=0.3.3",
  "numba>=0.62.1",
  "numpy>=2.3.4",
  "pandas>=2.3.3",
  "pgenlib>=0.93.0",
  "pyarrow>=21.0.0",
  "tqdm>=4.67.1",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

wheel.exclude = [
    "data",
    "result"
]
sdist.exclude = [
    "data",
    "result"
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.{h,c,hpp,cpp}" },
  { file = "CMakeLists.txt" },
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = ["ipython>=9.6.0"]
